<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Keyword Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
    <div v-if="isLoading" class="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <login-component
            v-if="!isAuthenticated && !showRegister && !isLoading"
            @login="handleLogin"
            @switch-to-register="showRegister = true"
            :error="error"
            :loading="loading"
    ></login-component>

    <register-component
            v-if="!isAuthenticated && showRegister && !isLoading"
            @register="handleRegister"
            @switch-to-login="showRegister = false"
            :error="error"
            :loading="loading"
    ></register-component>

    <telegram-dashboard-component
            v-if="isAuthenticated && !isLoading"
            :user="user"
            :accounts="accounts"
            @logout="handleLogout"
            @add-account="handleAddAccount"
            @delete-account="handleDeleteAccount"
            @stop-account="handleStopAccount"
            @start-account="handleStartAccount"
            @reload-accounts="handleReloadAccounts"
            @reload-user="handleReloadUser"
    ></telegram-dashboard-component>
</div>

<!-- Translations -->
<script src="js/translations.js"></script>

<!-- Utils -->
<script src="js/utils/api-client.js"></script>
<script src="js/utils/ui-helpers.js"></script>

<!-- Services -->
<script src="js/services/auth-service.js"></script>
<script src="js/services/account-service.js"></script>
<script src="js/services/task-service.js"></script>
<script src="js/services/balance-service.js"></script>

<!-- Mixins -->
<script src="js/mixins/modal-mixin.js"></script>

<!-- Components -->
<script src="js/components/login.js"></script>
<script src="js/components/register.js"></script>
<script src="js/components/profile-modal.js"></script>
<script src="js/components/verify-code-modal.js"></script>
<script src="js/components/account-modal.js"></script>
<script src="js/components/task-modal.js"></script>
<script src="js/components/topup-modal.js"></script>
<script src="js/components/dashboard-header.js"></script>
<script src="js/components/stats-section.js"></script>
<script src="js/components/task-item.js"></script>
<script src="js/components/task-list.js"></script>
<script src="js/components/account-list-item.js"></script>
<script src="js/components/telegram-dashboard.js"></script>

<!-- Main App -->
<script src="js/app.js"></script>
</body>
</html>
