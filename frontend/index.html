<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Keyword Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
    <!-- Loading State -->
    <div v-if="isLoading" class="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Auth Components -->
    <login-component
            v-if="!isAuthenticated && !showRegister && !isLoading"
            @login="handleLogin"
            @switch-to-register="showRegister = true"
            :error="error"
            :loading="loading"
    ></login-component>

    <register-component
            v-if="!isAuthenticated && showRegister && !isLoading"
            @register="handleRegister"
            @switch-to-login="showRegister = false"
            :error="error"
            :loading="loading"
    ></register-component>

    <!-- Dashboard -->
    <telegram-dashboard-component
            v-if="isAuthenticated && !isLoading"
            :user="user"
            :accounts="accounts"
            @logout="handleLogout"
            @add-account="handleAddAccount"
            @edit-account="handleEditAccount"
            @delete-account="handleDeleteAccount"
            @stop-account="handleStopAccount"
            @start-account="handleStartAccount"
            @reload-accounts="handleReloadAccounts"
            @reload-user="handleReloadUser"
    ></telegram-dashboard-component>
</div>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/components/login.js"></script>
<script src="js/components/register.js"></script>
<script src="js/components/account-modal.js"></script>
<script src="js/components/verify-code-modal.js"></script>
<script src="js/components/telegram-dashboard.js"></script>
<script src="js/components/profile-modal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
